# Playpen pipeline: every job is a NOP / log-only. Exercises common CI features.

include:
  - local: ci/templates.yml
  # Modular job structure (modules -> templates -> jobs). One input per module:
  # "off" drops the whole feature set, simple/fancy swap the implementation.
  - local: ci/modular.yml
    inputs:
      greeting: "off" # off | simple | fancy
      include_lint: true

default:
  image: alpine:3.20
  interruptible: true

variables:
  GREETING: "hello from the playpen"
  DEPLOY_ENV:
    value: "dev"
    options: ["dev", "staging", "prod"]
    description: "Target environment (shown in Run pipeline UI)"

stages: [prep, build, test, child, deploy, cleanup]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

# --- prep ---------------------------------------------------------------
dump-env:
  extends: .log-job
  stage: prep
  script:
    - echo "$GREETING"
    - env | grep -E '^(CI_|GITLAB_)' | sort

# --- build: artifacts + cache + parallel matrix -------------------------
build:
  extends: .log-job
  stage: build
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
        FLAVOUR: [slim, full]
  cache:
    key: "build-$ARCH"
    paths: [.cache/]
  script:
    - mkdir -p .cache dist
    - echo "pretend-building $ARCH/$FLAVOUR" | tee dist/build-$ARCH-$FLAVOUR.txt
    - date >> .cache/last-build
  artifacts:
    paths: [dist/]
    expire_in: 1 hour

# --- build: docker-in-docker ---------------------------------------------
# Needs a runner registered with privileged mode (see scripts/register-runner.sh).
docker-build:
  extends: .log-job
  stage: build
  needs: []
  # Only the privileged 'playpen-dind' runner carries this tag; every other job
  # is untagged and runs on the unprivileged 'playpen' runner.
  tags: [dind]
  image: docker:27-cli
  services:
    # No `alias:` — a docker:*-dind service is already reachable as `docker`
    # via its image name, and setting it explicitly collides with that implicit
    # alias ("alias is already in use by another service" in the job log).
    - name: docker:27-dind
      # The playpen registry is plain HTTP, so dind must be told to allow it.
      command: ["--insecure-registry=gitlab:5005"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - docker info
    - docker build -t "$IMAGE_TAG" .
    - docker run --rm "$IMAGE_TAG"
    # gitlab-ci-local predefines CI_REGISTRY but no credentials; only a real
    # GitLab sets CI_REGISTRY_USER, so use that to decide whether to push.
    - |
      if [ -n "$CI_REGISTRY_USER" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE_TAG"
        docker logout "$CI_REGISTRY"
      else
        echo "no registry credentials -- built only, not pushing"
      fi
    - docker image ls "$IMAGE_TAG"

# --- dotenv: pass computed values between jobs --------------------------
# artifacts:paths moves FILES between jobs; artifacts:reports:dotenv moves
# VARIABLES. Downstream jobs see $BUILD_TAG as a real CI variable, no file
# reading and no `source`. The usual use is computing an image tag in one job and
# consuming it in the build and deploy jobs that follow.
generate-tag:
  extends: .log-job
  stage: prep
  needs: []
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        TAG="mr-${CI_MERGE_REQUEST_IID}"
      else
        TAG="${CI_COMMIT_REF_SLUG}-${CI_PIPELINE_IID}"
      fi
      printf 'BUILD_TAG=%s\n' "$TAG" >> build.env
      printf 'BUILT_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

use-tag:
  extends: .log-job
  stage: test
  needs: [generate-tag]
  script:
    - echo "BUILD_TAG=$BUILD_TAG built at $BUILT_AT"
    # Fail loudly rather than silently echoing an empty string if the report
    # never arrived -- a missing dotenv artifact is otherwise invisible.
    - test -n "$BUILD_TAG"

# --- parent/child pipelines --------------------------------------------
# A job WRITES a pipeline, then a trigger job runs it as a separate pipeline.
# The generated child reuses ci/modular.yml with DIFFERENT inputs, so one commit
# produces both a `simple` greeting (parent) and a `fancy` one (child).
generate-child:
  extends: .log-job
  stage: prep
  needs: []
  script:
    - |
      cat > child-pipeline.yml <<'CHILD'
      # Generated by generate-child. Note it includes the same modular entry
      # point as the parent, with a different module selection.
      include:
        - local: ci/templates.yml
        - local: ci/modular.yml
          inputs:
            greeting: "fancy"
            include_lint: false
      stages: [prep, build, test, child, deploy, cleanup]
      CHILD
    - cat child-pipeline.yml
  artifacts:
    paths: [child-pipeline.yml]

child:
  stage: child
  needs: [generate-child]
  trigger:
    include:
      - artifact: child-pipeline.yml
        job: generate-child
    # `depend` makes this job mirror the child's status, so a failing child
    # fails the parent. Without it the trigger job goes green immediately.
    strategy: depend

# --- test: needs (DAG), retry, allow_failure, rules ---------------------
unit-tests:
  extends: .log-job
  stage: test
  needs: ["build"]
  script:
    - ls -la dist/
    - echo "all 0 tests passed"

flaky-test:
  extends: .log-job
  stage: test
  needs: []
  retry: 2
  allow_failure: true
  script:
    - echo "failing on purpose"
    - exit 1

only-on-main:
  extends: .log-job
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script: echo "running because branch is default"

# --- deploy: manual gate + environment ----------------------------------
deploy:
  extends: .log-job
  stage: deploy
  when: manual
  environment:
    name: $DEPLOY_ENV
  script:
    - echo "would deploy to $DEPLOY_ENV (NOP)"

# --- cleanup: always runs -----------------------------------------------
cleanup:
  extends: .log-job
  stage: cleanup
  when: always
  script: echo "cleanup (NOP)"
