# Modular pipeline entry point.
#
# Three layers, each with one job:
#   modules/    route    -- decide WHETHER and WHICH VARIANT to include. No job bodies.
#   templates/  implement-- hidden (.dot) jobs, reused via `extends`.
#   jobs/       instantiate -- concrete jobs that extend a template and pick a stage.
#
#   .gitlab-ci.yml -> ci/modular.yml -> ci/modules/<domain>.yml -> ci/templates/*.yml
#                                                              -> ci/jobs/<domain>.yml
#
# The point of the split: a consumer turns whole feature sets on and off with a
# flag, and swaps implementations without touching the job graph.
# One input per module, not a toggle plus a separate variant. `greeting` carries
# both the on/off decision and the implementation choice, so the relationship is
# structural: you cannot select a variant for a module that is off, and
# `include_greeting: false` + `greeting_variant: "fancy"` -- legal but meaningless
# under two inputs -- no longer expressible.
#
# lint stays a plain boolean because it has one implementation and nothing to pick.
#
# A selector shared across SEVERAL modules (a target environment or region, say) is
# the opposite case and belongs as its own input -- it is genuinely orthogonal to any
# one module's toggle.
spec:
  inputs:
    greeting:     { default: "simple", options: ["off", "simple", "fancy"], description: "Greeting module: off, or which implementation" }
    include_lint: { type: boolean, default: true, description: "Include the lint job" }
---

# Surfaced as ordinary CI variables so jobs can echo what was selected.
variables:
  GREETING_MODE: "$[[ inputs.greeting ]]"
  INCLUDE_LINT: "$[[ inputs.include_lint ]]"

include:
  - local: '/ci/modules/greeting.yml'
    inputs:
      greeting: $[[ inputs.greeting ]]
  # lint has exactly one implementation, so there is no routing decision to make.
  # A ci/modules/*.yml file only earns its place when it picks between 2+ impls
  # (see greeting); for a bare on/off toggle, gating the template and the jobs
  # file directly is one less file and one less hop.
  - local: '/ci/templates/lint.yml'
    rules:
      - if: '$[[ inputs.include_lint ]] == true'
  - local: '/ci/jobs/lint.yml'
    rules:
      - if: '$[[ inputs.include_lint ]] == true'

# NOTE: deliberately no `stages:` here. A shared entry point like this would normally
# own the stage list, but `stages` does not merge across included files -- the last
# definition wins -- so declaring it here would clobber .gitlab-ci.yml's. These jobs
# reuse the stages already defined there.
