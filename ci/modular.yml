# Modular pipeline entry point.
#
# Three layers, each with one job:
#   modules/    route    -- decide WHETHER and WHICH VARIANT to include. No job bodies.
#   templates/  implement-- hidden (.dot) jobs, reused via `extends`.
#   jobs/       instantiate -- concrete jobs that extend a template and pick a stage.
#
#   .gitlab-ci.yml -> ci/modular.yml -> ci/modules/<domain>.yml -> ci/templates/*.yml
#                                                              -> ci/jobs/<domain>.yml
#
# The point of the split: a consumer turns whole feature sets on and off with a
# flag, and swaps implementations without touching the job graph.
# `type: boolean` rather than strings with options: ["true","false"] -- the type
# itself is the validation, so a typo'd `True` is a type error instead of relying
# on an options list. greeting_variant stays a string because it is an enum, which
# is exactly what options: is for.
spec:
  inputs:
    include_greeting: { type: boolean, default: true, description: "Include the greeting jobs" }
    include_lint:     { type: boolean, default: true, description: "Include the lint job" }
    greeting_variant: { default: "simple", options: ["simple", "fancy"], description: "Greeting implementation" }
---

# Surfaced as ordinary CI variables so jobs can echo what was selected.
variables:
  INCLUDE_GREETING: "$[[ inputs.include_greeting ]]"
  INCLUDE_LINT: "$[[ inputs.include_lint ]]"
  GREETING_VARIANT: "$[[ inputs.greeting_variant ]]"

include:
  - local: '/ci/modules/greeting.yml'
    inputs:
      include_greeting: $[[ inputs.include_greeting ]]
      greeting_variant: $[[ inputs.greeting_variant ]]
  # lint has exactly one implementation, so there is no routing decision to make.
  # A ci/modules/*.yml file only earns its place when it picks between 2+ impls
  # (see greeting); for a bare on/off toggle, gating the template and the jobs
  # file directly is one less file and one less hop.
  - local: '/ci/templates/lint.yml'
    rules:
      - if: '$[[ inputs.include_lint ]] == true'
  - local: '/ci/jobs/lint.yml'
    rules:
      - if: '$[[ inputs.include_lint ]] == true'

# NOTE: deliberately no `stages:` here. base_project_include owns the stage list,
# but `stages` does not merge across included files -- the last definition wins --
# so declaring it here would clobber .gitlab-ci.yml's. These jobs reuse the
# stages already defined there.
